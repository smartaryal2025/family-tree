
name: Supabase Free Plan Activity Monitor

on:
  schedule:
    # Nepal time: 06:00, 14:00 and 22:00
    - cron: "15 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-read-check:
    name: Read-only Supabase API Check
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check Supabase members endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "ERROR: Required GitHub Secrets are missing."
            exit 1
          fi

          if ! status=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --head \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/members?select=*&limit=1" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Prefer: count=exact"); then
            status="000"
          fi

          if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "SUCCESS: Supabase read-only API check passed. HTTP $status"
          else
            echo "ERROR: Supabase API check failed. HTTP $status"
            exit 1
          fi
