<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अर्याल वंशावली - V1.2</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>अर्याल वंशावली</h1>
        <p>मूल पुर्खा: -</p>
    </header>

    <div class="toolbar-wrapper" data-html2canvas-ignore>
        <div class="header-panel" style="display: flex; flex-direction: column; gap: 12px; padding: 12px 15px;">
            
            <!-- माथिल्लो लाइन: सर्च बक्स र लगइन/इमेल -->
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; flex-wrap: wrap;">
                <div class="search-container" style="flex: 1; max-width: 400px; min-width: 200px;">
                    <input type="text" id="searchInput" placeholder="🔍 नाम खोज्नुहोस्..." oninput="handleSearchInput()" onfocus="handleSearchInput()" autocomplete="off">
                    <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
                    <div class="suggestions-box" id="searchSuggestions"></div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <!-- नयाँ सूचना घण्टी (Notification Bell) -->
                    <span id="notification-bell" onclick="openNotifications()" style="cursor:pointer; display:none; font-size:18px; position:relative;" title="सूचनाहरू">
                        🔔<span id="notif-badge" style="display:none; position:absolute; top:-5px; right:-8px; background:#e74c3c; color:white; border-radius:50%; padding:2px 5px; font-size:10px; font-weight:bold;">0</span>
                    </span>
                    <span id="loggedInUserEmail" style="font-size: 13px; color: #183153; font-weight: bold; display: none; white-space: nowrap;"></span>
                    <button class="header-btn" id="authBtn" onclick="openAuthModal()" style="width: auto; padding: 0 15px;">लगइन / दर्ता</button>
                </div>
            </div>
            
            <!-- तल्लो लाइन: बाँकी टुल्स बटनहरू -->
            <div class="header-buttons-right" style="justify-content: flex-start; width: 100%;">
                <button class="header-btn" onclick="openAddModal()">+ नयाँ सदस्य</button>
                <button class="header-btn" onclick="expandAll()">सबै देखाउने</button>
                <button class="header-btn" onclick="collapseAll()">सबै लुकाउने</button>
                <label class="toggle-label"><input type="checkbox" id="showDaughtersToggle" checked onchange="renderTree()"> छोरी</label>
                <label class="toggle-label"><input type="checkbox" id="staggerToggle" onchange="handleLayoutToggle()"> ठाडो</label>
                
                <div class="dropdown">
                    <button class="header-btn">डाटा ▾</button>
                    <div class="dropdown-content">
                        <button onclick="exportJSON()">💾 सेभ JSON</button>
                        <button onclick="document.getElementById('importFile').click()">📂 लोड JSON</button>
                        <button onclick="exportDataJS()">💾 सेभ JS</button> <!-- यो लाइन थपियो -->
                        <button onclick="factoryReset()">⚠️ रिसेट</button>
                    </div>
                </div>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(event)">
                <button class="header-btn" onclick="showExportOptions()">प्रिन्ट / डाउनलोड</button>
            </div>
        </div>
    </div>

    <div id="export-area">
        <h1 style="display:none; color:#183153; margin: 20px 0;">अर्याल वंशावली</h1>
        <div id="tree-viewport">
            <div id="zoom-layer">
                <svg id="lines-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                <div id="nodes-container"></div>
            </div>
            
            <!-- Fixed Vertical Navigation -->
            <div class="floating-nav" data-html2canvas-ignore>
                <button onclick="zoomCamera(1.3)" title="Zoom In">&#43;</button>
                <button onclick="centerCamera()" title="Reset View">⌂</button>
                <button onclick="zoomCamera(0.7)" title="Zoom Out">&#8722;</button>
            </div>
        </div>
    </div>
    
    <div id="print-container"></div>
    <div id="details-panel" class="details-panel"></div>

    <div id="drag-ghost-element" class="drag-ghost">सारिँदै छ...</div>

    <div id="export-modal" class="modal-overlay">
        <div class="modal-content" style="text-align: center;">
            <button class="close-modal-btn" onclick="closeExportModal()">✕</button>
            <h2 style="margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px;">Export Preview</h2>
            <div id="export-loading" style="padding: 20px; font-weight: bold; color: #3498db;">Processing Preview...</div>
            <div id="export-controls" style="display: none; margin-top: 10px; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;">
                <div>
                    <label style="font-weight: bold; color: #2c3e50;">Page Orientation: </label>
                    <select id="print-orientation" onchange="generatePaginationPreview()" style="padding: 5px; border-radius: 4px; border: 1px solid #cbd5e1;">
                        <option value="landscape">Landscape (Wide)</option>
                        <option value="portrait">Portrait (Tall)</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: bold; color: #2c3e50;">Print Size: <span id="print-size-val">100</span>%</label>
                    <input type="range" id="print-scale-slider" min="50" max="150" value="100" oninput="document.getElementById('print-size-val').innerText = this.value" onchange="generatePaginationPreview()" style="vertical-align: middle;">
                </div>
            </div>
            <div id="multi-page-preview"></div>
            <div id="export-buttons-container" style="display: none; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 15px; width: 100%;">
                <button class="export-btn" onclick="handleDownloadSingle('png')">Download PNG</button>
                <button class="export-btn" onclick="handleDownloadSingle('pdf')">Download PDF</button>
                <button class="export-btn" onclick="downloadMultiPagePDF()">Multi-Page PDF</button>
                <button class="export-btn" onclick="executeNativePrint()">Print</button>
            </div>
        </div>
    </div>

    <!-- Modals for Add/Edit -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeAddModal()">✕</button>
            <h2 style="margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px;">नयाँ सदस्य थप्नुहोस्</h2>
            <div style="display: flex; gap: 10px;">
                <div class="edit-form-group" style="flex-grow: 1;">
                    <label>नाम:</label>
                    <input type="text" id="add-name">
                </div>
                <div class="edit-form-group">
                    <label>लिङ्ग:</label>
                    <select id="add-gender" onchange="updateAddSpouseLabel()">
                        <option value="M">पुरुष</option>
                        <option value="F">महिला</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="edit-form-group" style="flex-grow: 1;">
                    <label>जन्म मिति (वैकल्पिक):</label>
                    <input type="text" id="add-birth">
                </div>
                <div class="edit-form-group" style="flex-grow: 1;">
                    <label>मृत्यु मिति (वैकल्पिक):</label>
                    <input type="text" id="add-death">
                </div>
            </div>
            <div class="edit-form-group">
                <label>क्रम:</label>
                <select id="add-hierarchy">
                    <option value="99">छैन</option>
                    <option value="1">जेठो / जेठी</option>
                    <option value="2">माइलो / माइली</option>
                    <option value="3">साँहिलो / साँहिली</option>
                    <option value="4">काइँलो / काइँली</option>
                    <option value="5">ठाइँलो / ठाइँली</option>
                    <option value="6">कान्छो / कान्छी (Last)</option>
                </select>
            </div>
            <div class="edit-form-group">
                <label>पिता:</label>
                <select id="add-parent" onchange="updateAddMotherDropdown(this.value)"></select>
            </div>
            <div class="edit-form-group">
                <label>माता (वैकल्पिक):</label>
                <select id="add-mother"><option value="">माता छान्नुहोस्...</option></select>
            </div>
            <div class="edit-form-group">
                <label id="add-spouse-label">पत्नी (वैकल्पिक):</label>
                <div class="spouse-list" id="add-spouse-list"></div>
                <div style="display: flex; margin-top: 5px;">
                    <input type="text" id="new-add-spouse-input" placeholder="नाम..." style="flex-grow: 1; padding: 6px;">
                    <button type="button" class="header-btn" onclick="addSpouseToAdd()" style="margin-left: 5px;">थप्नुहोस्</button>
                </div>
            </div>
            <div style="text-align: right; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                <button class="header-btn" onclick="saveNewNode()" style="padding: 8px 20px; width: 100%; max-width: 150px; background: #e2e8f0;">सेभ गर्नुहोस्</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeEditModal()">✕</button>
            <h2 style="margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px;">विवरण सम्पादन</h2>
            <input type="hidden" id="edit-id">
            <div style="display: flex; gap: 10px;">
                <div class="edit-form-group" style="flex-grow: 1;">
                    <label>नाम:</label>
                    <input type="text" id="edit-name">
                </div>
                <div class="edit-form-group">
                    <label>लिङ्ग:</label>
                    <select id="edit-gender" onchange="updateEditSpouseLabel()">
                        <option value="M">पुरुष</option>
                        <option value="F">महिला</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="edit-form-group" style="flex-grow: 1;">
                    <label>जन्म मिति (वैकल्पिक):</label>
                    <input type="text" id="edit-birth">
                </div>
                <div class="edit-form-group" style="flex-grow: 1;">
                    <label>मृत्यु मिति (वैकल्पिक):</label>
                    <input type="text" id="edit-death">
                </div>
            </div>
            <div class="edit-form-group">
                <label>क्रम:</label>
                <select id="edit-hierarchy">
                    <option value="99">छैन</option>
                    <option value="1">जेठो / जेठी</option>
                    <option value="2">माइलो / माइली</option>
                    <option value="3">साँहिलो / साँहिली</option>
                    <option value="4">काइँलो / काइँली</option>
                    <option value="5">ठाइँलो / ठाइँली</option>
                    <option value="6">कान्छो / कान्छी (Last)</option>
                </select>
            </div>
            <div class="edit-form-group">
                <label>पिता:</label>
                <select id="edit-parent" onchange="updateEditMotherDropdown(this.value)"></select>
            </div>
            <div class="edit-form-group">
                <label>माता (वैकल्पिक):</label>
                <select id="edit-mother"><option value="">माता छान्नुहोस्...</option></select>
            </div>
            <div class="edit-form-group">
                <label id="edit-spouse-label">पत्नी (वैकल्पिक):</label>
                <div class="spouse-list" id="edit-spouse-list"></div>
                <div style="display: flex; margin-top: 5px;">
                    <input type="text" id="new-spouse-input" placeholder="नाम..." style="flex-grow: 1; padding: 6px;">
                    <button type="button" class="header-btn" onclick="addSpouseToEdit()" style="margin-left: 5px;">थप्नुहोस्</button>
                </div>
            </div>
            <div style="text-align: right; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                <button class="header-btn" onclick="saveEdit()" style="padding: 8px 20px; width: 100%; max-width: 150px; background: #e2e8f0;">सेभ गर्नुहोस्</button>
            </div>
        </div>
    </div>
	<!-- लगइन / दर्ता मोडल -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 350px;">
            <button class="close-modal-btn" onclick="closeAuthModal()" type="button">✕</button>
            <h2 style="margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px;">लगइन / दर्ता</h2>
            
            <!-- onsubmit मा नयाँ फङ्सन राखिएको छ -->
            <form id="auth-form" onsubmit="submitAuthForm(event)">
                <div id="signup-fields" style="display: none;">
                    <div class="edit-form-group">
                        <label>पूरा नाम:</label>
                        <input type="text" id="auth-name" name="name" autocomplete="name" placeholder="तपाईंको पूरा नाम">
                    </div>
                    <div class="edit-form-group">
                        <label>मोबाइल नम्बर:</label>
                        <input type="text" id="auth-phone" name="tel" autocomplete="tel" placeholder="तपाईंको मोबाइल नम्बर">
                    </div>
                </div>

                <div class="edit-form-group">
                    <label>इमेल:</label>
                    <input type="email" id="auth-email" name="email" autocomplete="username" placeholder="तपाईंको इमेल">
                </div>
                <div class="edit-form-group">
                    <label>पासवर्ड:</label>
                    <!-- Enter थिच्दा सिधै submit होस् भनेर onkeydown हटाइएको छ -->
                    <input type="password" id="auth-password" name="password" autocomplete="current-password" placeholder="पासवर्ड (कम्तीमा ६ अक्षर)">
                </div>
                <div style="text-align: center; margin-top: 15px;">
                    <!-- Type लाई submit बनाइएको छ -->
                    <button type="submit" class="header-btn" id="login-btn-main" style="width: 100%; background: #3498db; color: white; margin-bottom: 10px;">लगइन (Login)</button>
                    <!-- दर्ता बटन type="button" नै हुन्छ -->
                    <button type="button" class="header-btn" id="signup-btn-main" onclick="handleSignup()" style="width: 100%; background: #2ecc71; color: white;">नयाँ दर्ता (Sign Up)</button>
                    <button type="button" id="back-to-login-btn" onclick="showLoginOnly()" style="display:none; width: 100%; margin-top: 10px; background: transparent; color: #3498db; border: none; cursor: pointer; text-decoration: underline;">लगइनमा फर्कनुहोस्</button>
                </div>
                <div id="auth-message" style="margin-top: 10px; font-size: 13px; color: #e74c3c; text-align: center;"></div>
            </form>
        </div>
    </div>

    <!-- प्रोफाइल सम्पादन मोडल -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 350px;">
            <button class="close-modal-btn" onclick="closeProfileModal()">✕</button>
            <h2 style="margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px;">प्रोफाइल सम्पादन</h2>
            <div class="edit-form-group">
                <label>पूरा नाम:</label>
                <input type="text" id="prof-name">
            </div>
            <div class="edit-form-group">
                <label>मोबाइल नम्बर:</label>
                <input type="text" id="prof-phone">
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <button class="header-btn" onclick="saveProfile()" style="background: #27ae60; color: white; width:100%;">सेभ गर्नुहोस्</button>
            </div>
            <div id="prof-message" style="margin-top: 10px; font-size: 13px; text-align: center;"></div>
        </div>
    </div>
	<!-- एडमिन प्यानल मोडल (प्रस्तावहरू जाँच्ने) -->
    <div id="admin-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <button class="close-modal-btn" onclick="closeAdminModal()">✕</button>
            <h2 style="margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px;">🛡️ एडमिन प्यानल</h2>
            <p style="font-size: 13px; color: #7f8c8d; margin-top: 0;">नयाँ सदस्य थप्ने प्रस्तावहरू (Pending Proposals)</p>
            <div id="proposals-list" style="max-height: 350px; overflow-y: auto; margin-top: 10px;">
                लोड हुँदैछ...
            </div>
        </div>
    </div>
    <!-- सूचनाहरू (Notifications) मोडल -->
    <div id="notif-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 350px;">
            <button class="close-modal-btn" onclick="closeNotifications()">✕</button>
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom:10px;">
                <h2 style="margin: 0; color: #2c3e50; font-size: 18px;">🔔 सूचनाहरू</h2>
                <button onclick="clearNotifications()" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px; cursor:pointer;">सबै हटाउने</button>
            </div>
            <div id="notif-list" style="max-height: 300px; overflow-y: auto;">
                लोड हुँदैछ...
            </div>
        </div>
    </div>
	<script src="app.js"></script>
</body>
</html>
